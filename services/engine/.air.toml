# Air hot-reload configuration for development
root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/engine"
  cmd = "go build -o ./tmp/engine ./..."
  delay = 1000
  exclude_dir = ["tmp", "vendor", "db/gen"]
  exclude_regex = ["_test\\.go"]
  include_ext = ["go", "toml"]
  kill_delay = "0s"
  log = "build-errors.log"
  send_interrupt = false
  stop_on_error = true

[log]
  time = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[misc]
  clean_on_exit = false
