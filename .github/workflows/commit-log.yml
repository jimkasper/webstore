name: Commit log
on:
  push:
    branches-ignore: ['gh-pages']
permissions:
  contents: write
jobs:
  commit-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash scripts/commit-log.sh
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain COMMIT_LOG.txt)" ]; then
            git config user.name "commit-log[bot]"
            git config user.email "commit-log@users.noreply.github.com"
            git add COMMIT_LOG.txt
            git commit -m "Update commit log [skip ci]"
            git push
          fi
